name: CI

on:
  push:
    branches: [master, unstable]
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install Neovim (stable)
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Install GNU make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y

      # tests/minimal_init.lua puts <stdpath data>/lazy/plenary.nvim on the
      # runtimepath.
      - name: Install plenary.nvim
        run: |
          data="$(nvim --clean --headless -c 'lua io.write(vim.fn.stdpath("data"))' -c 'qa!')"
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim "$data/lazy/plenary.nvim"

      # The specs run a real lw: the release the plugin pins
      # (lua/loomworks/provision/pinned.lua), provisioned into .lw-test/ by
      # `make lw` (scripts/test_lw.lua) with the plugin's own download code.
      # A new pin is a new cache key.
      - name: Cache the pinned lw
        uses: actions/cache@v4
        with:
          path: .lw-test
          key: lw-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lua/loomworks/provision/pinned.lua') }}

      - name: Provision the pinned lw
        run: make lw

      # scripts/run_specs.lua runs every spec file at once under one
      # whole-suite budget (TEST_TIMEOUT, see Makefile) and names each file
      # that failed; `make test` points the specs at .lw-test/ (LOOMWORKS_LW).
      - name: Run test suite
        run: make test

  vendor-check:
    name: Vendored files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The vendored files match VENDOR.MANIFEST (sha256 of each, no extra
      # files under a vendored directory).
      - name: Check the manifest
        run: scripts/vendor.sh --check

      # The manifest matches loomworks itself: re-vendoring from the
      # manifest's tag reproduces the tree and the manifest (tag, commit and
      # every file) byte for byte.
      - name: Re-vendor from the manifest's tag
        run: |
          tag="$(sed -n 's/^tag //p' VENDOR.MANIFEST)"
          src="$RUNNER_TEMP/loomworks"
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch "$tag" https://github.com/samienne/loomworks "$src"
          scripts/vendor.sh "$src" "$tag"
          git status --porcelain
          test -z "$(git status --porcelain)"
