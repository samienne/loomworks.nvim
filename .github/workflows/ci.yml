name: CI

on:
  push:
    branches: [master, unstable]
  pull_request:

jobs:
  test:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Neovim (stable)
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Install Ninja
        run: choco install ninja -y

      - name: Install plenary.nvim
        shell: pwsh
        run: |
          $dest = "$env:LOCALAPPDATA\nvim-data\lazy\plenary.nvim"
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim $dest

      # The daemon specs run a real lw: the release the plugin pins
      # (scripts/test_lw.lua, `make lw`), given to them as LOOMWORKS_LW.
      - name: Provision the pinned lw
        shell: bash
        run: |
          eval "$(nvim -l scripts/test_lw.lua .lw-test)"
          echo "LOOMWORKS_LW=$LOOMWORKS_LW" >> "$GITHUB_ENV"
          echo "LOOMWORKS_INSTALL_DIR=$LOOMWORKS_INSTALL_DIR" >> "$GITHUB_ENV"

      # Plenary runs every spec file concurrently under ONE whole-suite budget
      # (default 50 s); a file still running at the deadline prints no summary
      # and fails the job. Size it for a loaded 4-core runner (see Makefile).
      - name: Run test suite
        shell: pwsh
        run: |
          nvim --headless -u tests/minimal_init.lua `
            -c "PlenaryBustedDirectory tests/ {minimal_init = 'tests/minimal_init.lua', timeout = 600000}"
