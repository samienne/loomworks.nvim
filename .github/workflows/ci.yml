name: CI

on:
  push:
    branches: [master, unstable]
  pull_request:

jobs:
  test:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Neovim (stable)
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Install Ninja
        run: choco install ninja -y

      - name: Install plenary.nvim
        shell: pwsh
        run: |
          $dest = "$env:LOCALAPPDATA\nvim-data\lazy\plenary.nvim"
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim $dest

      # Every spec file runs concurrently, as under PlenaryBustedDirectory,
      # under ONE whole-suite budget sized for a loaded 4-core runner (see
      # Makefile). scripts/run_specs.lua ends with a table naming each file
      # that exited non-zero (also after a clean summary, with its nvim log),
      # printed no summary, or was still running at the deadline.
      - name: Run test suite
        shell: pwsh
        run: nvim -l scripts/run_specs.lua --timeout 600000 --init tests/minimal_init.lua tests

  standalone:
    name: Standalone bootstrap tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The boot modules (verify/json/paths/download/update) depend on luvi's
      # OpenSSL, so they run under luvi rather than the nvim/busted suite. Running
      # on Linux also guards the byte-exact signature fixtures against EOL drift.
      - name: Fetch luvi
        run: |
          curl -fsSL -o luvi \
            https://github.com/luvit/luvi/releases/download/v2.15.0/luvi-Linux-x86_64-luajit-regular
          chmod +x luvi

      - name: Run standalone suite
        run: ./luvi tests/standalone

  standalone-windows:
    name: Standalone bootstrap tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # The Windows-only sections: lw.cmd against real cmd.exe (PATH-shadowed
      # system tools, download retry, console Ctrl-C / Ctrl-Break with no
      # "Terminate batch job" prompt) and the redirect's re-exec under a
      # console interrupt.
      - name: Fetch luvi
        shell: bash
        run: |
          curl -fsSL -o luvi.exe \
            https://github.com/luvit/luvi/releases/download/v2.15.0/luvi-Windows-amd64-luajit-regular.exe

      - name: Run standalone suite
        shell: bash
        run: ./luvi.exe tests/standalone

  cli-e2e:
    name: CLI e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            luvi_asset: luvi-Linux-x86_64-luajit-regular
          - os: macos-latest
            luvi_asset: luvi-Darwin-arm64-luajit-regular
          - os: windows-latest
            luvi_asset: luvi-Windows-amd64-luajit-regular.exe
    steps:
      - uses: actions/checkout@v5

      # A C/C++ toolchain + cmake/meson/ninja so the CLI can actually configure
      # and build the sample projects. On Windows we use mingw (self-contained
      # gcc — no VS dev-shell needed) which also exercises the run-env DLL setup.
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build meson g++

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja meson

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja mingw -y
          python -m pip install --upgrade meson

      - name: Fetch luvi
        shell: bash
        run: |
          asset="${{ matrix.luvi_asset }}"
          out="luvi"; [ "${asset##*.}" = "exe" ] && out="luvi.exe"
          curl -fsSL -o "$out" \
            "https://github.com/luvit/luvi/releases/download/v2.15.0/${asset}"
          chmod +x "$out" || true

      - name: Fuse the lw binary
        shell: bash
        run: |
          if [ -f luvi.exe ]; then ./luvi.exe lua --output lw.exe; else ./luvi lua --output lw && chmod +x lw; fi

      - name: Smoke test — the fused binary runs
        shell: bash
        run: |
          export LOOMWORKS_LUA="$PWD/lua"
          lw="$PWD/lw"; [ -f "$PWD/lw.exe" ] && lw="$PWD/lw.exe"
          "$lw" version

      # Fuses real old/new hosts and lets the old one self-update (spec §16.32)
      # against a local signed mirror — on Windows this is the only check of
      # the running-.exe rename-aside swap.
      - name: Host self-update end-to-end
        shell: bash
        run: |
          l="$PWD/luvi"; [ -f "$PWD/luvi.exe" ] && l="$PWD/luvi.exe"
          bash scripts/ci/host-self-update-e2e.sh "$l"

      - name: Run CLI end-to-end (meson + cmake, build/run/test/clean)
        shell: bash
        run: |
          export LOOMWORKS_LUA="$PWD/lua"
          lw="$PWD/lw"; [ -f "$PWD/lw.exe" ] && lw="$PWD/lw.exe"
          LW="$lw" bash scripts/ci/cli-e2e.sh

      # The workspace daemon with real processes (spec §19.2, §19.6–§19.11):
      # detached launch, no inherited std handles, stop/kill end the process,
      # one daemon per workspace, hung-daemon recovery, nothing left running.
      - name: Daemon lifetime end-to-end
        shell: bash
        run: |
          export LOOMWORKS_LUA="$PWD/lua"
          lw="$PWD/lw"; [ -f "$PWD/lw.exe" ] && lw="$PWD/lw.exe"
          LW="$lw" bash scripts/ci/daemon-e2e.sh

  # The bundle from this checkout under real released hosts (spec §16.14): an
  # old host that `lw self-update`d runs the newest bundle with its own, older
  # boot modules. Hosts are downloaded from GitHub releases and verified against
  # each release's signed SHA256SUMS; nothing else touches the network.
  old-host-compat:
    name: Old-host compat (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Run the bundle under v0.1.2 / v0.1.28 / v0.1.33 / v0.1.37 / v0.1.42 hosts
        shell: bash
        env:
          REPO_SLUG: ${{ github.repository }}
        run: bash scripts/ci/old-host-compat.sh

  # The plugin pin (spec 19.16 "Plugin pin"): lua/loomworks/provision/pinned.lua
  # names the last published release; check its signed hashes and that its
  # descriptor offers the interfaces this checkout's editor client needs. A
  # WARNING only: a development checkout may need interfaces newer than any
  # release (the editor then degrades with feature notes; developers point
  # binary.path / LOOMWORKS_LW at a newer lw). The release workflow's publish
  # stage runs the same check as a hard gate.
  pin-check:
    name: Plugin pin (warning only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Warning only, also when a tool breaks: a failed Neovim install or a
      # crash of openssl/nvim becomes a ::warning::, never a red job.
      - name: Install Neovim (stable)
        id: nvim
        continue-on-error: true
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Check the pinned release
        continue-on-error: true
        shell: bash
        env:
          REPO_SLUG: ${{ github.repository }}
          NVIM_OUTCOME: ${{ steps.nvim.outcome }}
        run: |
          if [ "$NVIM_OUTCOME" != success ]; then
            echo "::warning title=lw pin::Neovim did not install; the pin was not checked"; exit 0
          fi
          ver="$(sed -n 's/^ *version = "\([^"]*\)",$/\1/p' lua/loomworks/provision/pinned.lua)"
          echo "pinned lw: $ver"
          mkdir -p pin
          base="https://github.com/$REPO_SLUG/releases/download/v$ver"
          for f in SHA256SUMS SHA256SUMS.sig "lw-$ver-descriptor.json"; do
            curl -fsSL -o "pin/$f" "$base/$f" || { echo "::warning title=lw pin::v$ver publishes no $f"; rm -f "pin/$f"; }
          done
          # No host binaries here (the release gate hashes those): --no-binaries.
          rc=0
          nvim -l scripts/release/pin.lua verify "$ver" pin --warn --no-binaries || rc=$?
          if [ "$rc" != 0 ]; then
            echo "::warning title=lw pin::the pin check itself failed (exit $rc); the pin was not checked"
          fi
